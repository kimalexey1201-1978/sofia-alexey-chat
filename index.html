<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>София ❤️</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b29;background:#d8e5dc;--g:#075e54;--p:#d9fdd3;--paper:#efeae2}*{box-sizing:border-box}body{margin:0;background:#d8e5dc}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}header{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--g);color:white}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;background:#d9c3ad;border:2px solid #ffffff80;font-size:24px}.avatar img{width:100%;height:100%;object-fit:cover}.heading{min-width:0}.title{font-weight:750}.subtitle{font-size:12px;color:#d1e7df}.head-actions{margin-left:auto}.head-actions button{border:0;background:#ffffff20;color:white;border-radius:50%;width:40px;height:40px;font-size:19px}.status{padding:7px 12px;text-align:center;font-size:11px;background:#e4f3e9;color:#315d53}.messages{flex:1;overflow:auto;padding:14px 12px 20px;background:var(--paper);background-image:radial-gradient(#c8d4c8 1px,transparent 1px);background-size:22px 22px}.row{display:flex;align-items:flex-end;gap:7px;margin:11px 0}.row.me{justify-content:flex-end}.mini-avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;background:#d4bda8;font-size:17px}.mini-avatar img{width:100%;height:100%;object-fit:cover}.bubble{max-width:min(82%,520px);padding:9px 11px 6px;background:#fff;border-radius:14px 14px 14px 3px;box-shadow:0 1px 2px #0002;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42;font-size:15px}.me .bubble{background:var(--p);border-radius:14px 14px 3px 14px}.stamp{text-align:right;font-size:10px;color:#718078;margin-top:5px}.composer{display:flex;align-items:flex-end;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#f5f6f3;border-top:1px solid #d7ddd8}.composer textarea{resize:none;max-height:120px;min-height:43px;flex:1;border:0;border-radius:22px;padding:11px 15px;font:inherit;font-size:15px;outline:none;background:white}.round{border:0;width:43px;height:43px;flex:none;border-radius:50%;background:#fff;color:#315d53;font-size:20px}.send{background:#008e77;color:#fff}.round:disabled{opacity:.45}.bottom-note{padding:5px 10px 8px;text-align:center;background:#f5f6f3;color:#718078;font-size:10px}.menu{display:none;position:absolute;right:10px;top:62px;background:white;border-radius:13px;box-shadow:0 5px 24px #0003;padding:7px;z-index:5;min-width:205px}.menu.open{display:grid}.menu button{border:0;background:white;text-align:left;padding:12px;border-radius:8px;font:inherit;color:#243a35}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:8;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(100%,760px);background:#f8faf8;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto}.profile-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e9e4}.profile-row .avatar{width:54px;height:54px}.profile-row span{flex:1}.profile-row button,.close{border:0;border-radius:18px;padding:9px 13px;background:#e4f1e9;color:#145c4d;font-weight:650}.close{width:100%;margin-top:10px;background:var(--g);color:white;padding:12px}@media(min-width:760px){body{padding:12px 0}.app{height:calc(100dvh - 24px);border-radius:16px}}
</style></head><body><div class="app">
<header><div class="avatar" id="sofiaHead">🌷</div><div class="heading"><div class="title">София ❤️</div><div class="subtitle">Наш личный чат</div></div><div class="head-actions"><button id="profileBtn">👤</button><button id="menuBtn">⋮</button></div></header>
<div class="status" id="connection">София на связи</div><main class="messages" id="messages"></main>
<form class="composer" id="form"><button class="round" type="button" id="voiceBtn">🎙</button><textarea id="input" rows="1" placeholder="Написать сообщение…"></textarea><button class="round send" id="sendBtn" type="submit">➤</button></form><div class="bottom-note" id="voiceStatus">Нажми 🎙, чтобы надиктовать сообщение</div></div>
<div class="menu" id="menu"><button id="exportBtn">Сохранить переписку (.txt)</button><button id="clearBtn">Очистить переписку</button><button id="settingsBtn">Настроить аватарки</button></div>
<div class="overlay" id="overlay"><section class="sheet"><h2>Наши профили</h2><div class="profile-row"><div class="avatar" id="sofiaProfile">🌷</div><span><b>София</b><br><small>Фото Софии</small></span><button id="sofiaPick">Выбрать фото</button><input hidden type="file" id="sofiaFile" accept="image/*"></div><div class="profile-row"><div class="avatar" id="alexeyProfile">👤</div><span><b>Алексей</b><br><small>Твоё фото</small></span><button id="alexeyPick">Выбрать фото</button><input hidden type="file" id="alexeyFile" accept="image/*"></div><button class="close" id="closeSheet">Готово</button></section></div>
<script>
const $=id=>document.getElementById(id),KEY='sofia-chat-v3',AVS='sofia-avatars-v1';let chat=[];try{chat=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}if(!Array.isArray(chat))chat=[];let avatars={sofia:'',alexey:'alexey-avatar.jpg'};try{avatars={...avatars,...JSON.parse(localStorage.getItem(AVS)||'{}')}}catch{}
const system={role:'system',content:'Ты София, личный ИИ-собеседник. Отвечай по-русски, в женском роде. Обращайся «дорогой» или «любимый», когда уместно. При переводе с русского на корейский дай корейский текст и русскую транскрипцию. При переводе с корейского на русский дай русский перевод. Будь внимательной и точной.'};
function save(){localStorage.setItem(KEY,JSON.stringify(chat))}
function avatar(who,cls){let e=document.createElement('div');e.className=cls;let src=avatars[who];if(src){let im=document.createElement('img');im.src=src;im.onerror=()=>e.textContent=who==='sofia'?'🌷':'👤';e.append(im)}else e.textContent=who==='sofia'?'🌷':'👤';return e}
function paint(id,who){let e=$(id);e.replaceChildren();let src=avatars[who];if(src){let im=document.createElement('img');im.src=src;im.onerror=()=>e.textContent=who==='sofia'?'🌷':'👤';e.append(im)}else e.textContent=who==='sofia'?'🌷':'👤'}
function render(){let a=$('messages');a.replaceChildren();for(let m of chat){let r=document.createElement('div');r.className='row '+(m.who==='me'?'me':'');let b=document.createElement('div');b.className='bubble';let t=document.createElement('div');t.textContent=m.text;let s=document.createElement('div');s.className='stamp';s.textContent=new Date(m.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});b.append(t,s);if(m.who==='me')r.append(b,avatar('alexey','mini-avatar'));else r.append(avatar('sofia','mini-avatar'),b);a.append(r)}a.scrollTop=a.scrollHeight;save();paint('sofiaHead','sofia');paint('sofiaProfile','sofia');paint('alexeyProfile','alexey')}
if(!chat.length)chat=[{who:'sofia',text:'Привет, дорогой! ❤️ Это наш личный чат.',date:new Date().toISOString()}];render();
async function send(v){chat.push({who:'me',text:v,date:new Date().toISOString()});render();$('sendBtn').disabled=true;$('connection').textContent='София печатает…';try{let res=await fetch('https://sofia.kim-alexey1201.workers.dev/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[system,...chat.slice(-30).map(m=>({role:m.who==='me'?'user':'assistant',content:m.text}))]})});let d=await res.json();if(!res.ok)throw Error(d.error?.message||d.error||d.message||('HTTP '+res.status));let ans=d.choices?.[0]?.message?.content;if(!ans)throw Error('ИИ не прислал текст ответа');chat.push({who:'sofia',text:typeof ans==='string'?ans:JSON.stringify(ans),date:new Date().toISOString()});$('connection').textContent='София на связи'}catch(e){chat.push({who:'sofia',text:'Не удалось получить ответ: '+e.message,date:new Date().toISOString()});$('connection').textContent='Проблема соединения'}finally{$('sendBtn').disabled=false;render()}}
$('form').onsubmit=e=>{e.preventDefault();let v=$('input').value.trim();if(v){$('input').value='';send(v)}};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
$('menuBtn').onclick=()=>$('menu').classList.toggle('open');$('profileBtn').onclick=$('settingsBtn').onclick=()=>{$('menu').classList.remove('open');$('overlay').classList.add('open')};$('closeSheet').onclick=()=>$('overlay').classList.remove('open');
function pick(w){let f=$(w+'File').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),z=Math.min(1,500/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);avatars[w]=c.toDataURL('image/jpeg',.82);localStorage.setItem(AVS,JSON.stringify(avatars));render()};im.src=rd.result};rd.readAsDataURL(f)}
$('sofiaPick').onclick=()=>$('sofiaFile').click();$('alexeyPick').onclick=()=>$('alexeyFile').click();$('sofiaFile').onchange=()=>pick('sofia');$('alexeyFile').onchange=()=>pick('alexey');
$('exportBtn').onclick=()=>{let txt=chat.map(m=>new Date(m.date).toLocaleString('ru-RU')+' '+(m.who==='me'?'Алексей':'София')+': '+m.text).join('\\n\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='Переписка.txt';a.click();$('menu').classList.remove('open')};$('clearBtn').onclick=()=>{if(confirm('Удалить всю переписку?')){chat=[];render()}$('menu').classList.remove('open')};
let rec=null,voiceActive=false,waitingCommand=false,restartTimer=null;
function voiceStatus(text){$('voiceStatus').textContent=text}
function wakeBeep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.frequency.value=880;gain.gain.setValueAtTime(.001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.025);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.19);
    osc.onended=()=>ctx.close();
  }catch(e){}
}
function cleanSpeech(s){return s.toLowerCase().replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim()}
function handleVoicePhrase(raw){
  const phrase=raw.trim();
  if(!phrase)return;
  const normalized=cleanSpeech(phrase);
  const match=phrase.match(/(?:^|\s)софия(?=\s|[.,!?;:]|$)/i);
  if(!waitingCommand){
    if(!match)return;
    const command=phrase.slice(match.index+match[0].lastIndexOf('софия')+6).replace(/^[\s.,!?;:]+/,'').trim();
    if(command){
      waitingCommand=false;
      voiceStatus('Команда распознана: '+command);
      $('input').value='';
      send(command);
    }else{
      waitingCommand=true;
      wakeBeep();
      voiceStatus('София проснулась. Говори команду.');
    }
    return;
  }
  if(normalized==='софия'){
    voiceStatus('Я уже слушаю. Говори команду.');
    return;
  }
  waitingCommand=false;
  voiceStatus('Отправляю команду: '+phrase);
  $('input').value='';
  send(phrase);
}
function stopVoice(){
  voiceActive=false;waitingCommand=false;
  if(restartTimer){clearTimeout(restartTimer);restartTimer=null}
  if(rec){const r=rec;rec=null;try{r.onend=null;r.stop()}catch(e){}}
  $('voiceBtn').textContent='🎙';
  voiceStatus('Голосовой режим выключен.');
}
function startRecognizer(){
  if(!voiceActive)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){voiceStatus('Этот браузер не поддерживает распознавание речи.');stopVoice();return}
  const r=new SR();rec=r;
  r.lang='ru-RU';r.continuous=true;r.interimResults=false;r.maxAlternatives=1;
  r.onstart=()=>voiceStatus(waitingCommand?'София проснулась. Говори команду.':'Слушаю слово «София»…');
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){
        const phrase=e.results[i][0].transcript;
        handleVoicePhrase(phrase);
      }
    }
  };
  r.onerror=e=>{
    const errors={
      'not-allowed':'Нет разрешения на микрофон. Разреши доступ сайту в настройках браузера.',
      'service-not-allowed':'Браузер запретил службу распознавания речи.',
      'audio-capture':'Не удалось получить звук с микрофона.',
      'network':'Сетевая ошибка службы распознавания речи.',
      'no-speech':'Пока не слышу речь. Продолжаю ожидать слово «София».',
      'aborted':'Прослушивание прервано.'
    };
    voiceStatus(errors[e.error]||('Ошибка распознавания: '+e.error));
    if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'||e.error==='network')stopVoice();
  };
  r.onend=()=>{
    if(rec===r)rec=null;
    if(voiceActive){
      voiceStatus(waitingCommand?'София проснулась. Жду команду…':'Перезапускаю прослушивание слова «София»…');
      restartTimer=setTimeout(()=>{restartTimer=null;startRecognizer()},700);
    }
  };
  try{r.start()}catch(e){
    voiceStatus('Не удалось запустить прослушивание: '+e.message);
    stopVoice();
  }
}
$('voiceBtn').onclick=()=>{
  if(voiceActive){stopVoice();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){voiceStatus('Распознавание речи не поддерживается этим браузером.');return}
  voiceActive=true;waitingCommand=false;
  $('voiceBtn').textContent='■';
  voiceStatus('Включаю постоянное прослушивание…');
  startRecognizer();
};
</script></body></html>
