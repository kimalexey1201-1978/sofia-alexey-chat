<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>София ❤️</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b29;background:#d8e5dc;--g:#075e54;--p:#d9fdd3;--paper:#efeae2}*{box-sizing:border-box}body{margin:0;background:#d8e5dc}.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}header{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--g);color:white}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;background:#d9c3ad;border:2px solid #ffffff80;font-size:24px}.avatar img{width:100%;height:100%;object-fit:cover}.heading{min-width:0}.title{font-weight:750}.subtitle{font-size:12px;color:#d1e7df}.head-actions{margin-left:auto}.head-actions button{border:0;background:#ffffff20;color:white;border-radius:50%;width:40px;height:40px;font-size:19px}.status{padding:7px 12px;text-align:center;font-size:11px;background:#e4f3e9;color:#315d53}.status button{margin-left:9px;border:0;border-radius:12px;padding:5px 10px;background:#075e54;color:white;font:inherit;font-weight:650}.messages{flex:1;overflow:auto;padding:14px 12px 20px;background:var(--paper);background-image:radial-gradient(#c8d4c8 1px,transparent 1px);background-size:22px 22px}.row{display:flex;align-items:flex-end;gap:7px;margin:11px 0}.row.me{justify-content:flex-end}.mini-avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;background:#d4bda8;font-size:17px}.mini-avatar img{width:100%;height:100%;object-fit:cover}.bubble{max-width:min(82%,520px);padding:9px 11px 6px;background:#fff;border-radius:14px 14px 14px 3px;box-shadow:0 1px 2px #0002;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.42;font-size:15px}.me .bubble{background:var(--p);border-radius:14px 14px 3px 14px}.stamp{text-align:right;font-size:10px;color:#718078;margin-top:5px}.composer{display:flex;align-items:flex-end;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#f5f6f3;border-top:1px solid #d7ddd8}.composer textarea{resize:none;max-height:120px;min-height:43px;flex:1;border:0;border-radius:22px;padding:11px 15px;font:inherit;font-size:15px;outline:none;background:white}.round{border:0;width:43px;height:43px;flex:none;border-radius:50%;background:#fff;color:#315d53;font-size:20px}.send{background:#008e77;color:#fff}.round:disabled{opacity:.45}.bottom-note{padding:5px 10px 8px;text-align:center;background:#f5f6f3;color:#718078;font-size:10px}.menu{display:none;position:absolute;right:10px;top:62px;background:white;border-radius:13px;box-shadow:0 5px 24px #0003;padding:7px;z-index:5;min-width:205px}.menu.open{display:grid}.menu button{border:0;background:white;text-align:left;padding:12px;border-radius:8px;font:inherit;color:#243a35}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:8;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(100%,760px);background:#f8faf8;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto}.profile-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e9e4}.profile-row .avatar{width:54px;height:54px}.profile-row span{flex:1}.profile-row button,.close{border:0;border-radius:18px;padding:9px 13px;background:#e4f1e9;color:#145c4d;font-weight:650}.close{width:100%;margin-top:10px;background:var(--g);color:white;padding:12px}@media(min-width:760px){body{padding:12px 0}.app{height:calc(100dvh - 24px);border-radius:16px}}
</style></head><body><div class="app">
<header><div class="avatar" id="sofiaHead">🌷</div><div class="heading"><div class="title">София ❤️</div><div class="subtitle">Наш личный чат</div></div><div class="head-actions"><button id="profileBtn">👤</button><button id="menuBtn">⋮</button></div></header>
<div class="status" id="connection">София на связи</div><main class="messages" id="messages"></main>
<form class="composer" id="form"><button class="round" type="button" id="voiceBtn">🎙</button><textarea id="input" rows="1" placeholder="Написать сообщение…"></textarea><button class="round send" id="sendBtn" type="submit">➤</button></form><div class="bottom-note" id="voiceStatus">Нажми 🎙, чтобы надиктовать сообщение</div></div>
<div class="menu" id="menu"><button id="exportBtn">Сохранить переписку (.txt)</button><button id="clearBtn">Очистить переписку</button><button id="settingsBtn">Настроить аватарки</button></div>
<div class="overlay" id="overlay"><section class="sheet"><h2>Наши профили</h2><div class="profile-row"><div class="avatar" id="sofiaProfile">🌷</div><span><b>София</b><br><small>Фото Софии</small></span><button id="sofiaPick">Выбрать фото</button><input hidden type="file" id="sofiaFile" accept="image/*"></div><div class="profile-row"><div class="avatar" id="alexeyProfile">👤</div><span><b>Ты</b><br><small>Твоё фото</small></span><button id="alexeyPick">Выбрать фото</button><input hidden type="file" id="alexeyFile" accept="image/*"></div><button class="close" id="closeSheet">Готово</button></section></div>
<script type="module">
import { applyAssistantResult, buildChatRequestMessages } from './src/client/chat-result.mjs';
import { resolveChatApiUrl } from './src/client/chat-api-url.mjs';
const CHAT_API_URL=resolveChatApiUrl(window.location);
const $=id=>document.getElementById(id),KEY='sofia-chat-v3',AVS='sofia-avatars-v1';let chat=[];try{chat=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}if(!Array.isArray(chat))chat=[];let avatars={sofia:'',alexey:'alexey-avatar.jpg'};try{avatars={...avatars,...JSON.parse(localStorage.getItem(AVS)||'{}')}}catch{}
const system={role:'system',content:'Ты София, личный ИИ-собеседник. Отвечай по-русски, используя женский род. Не обращайся к пользователю словом «любимый». Другие ласковые обращения допустимы. При переводе с русского на корейский предоставляй корейский текст и русскую транскрипцию. При переводе с корейского на русский предоставляй только русский перевод. Будь внимательной, точной и честно обозначай неопределённость. Точно следуй запросу пользователя: не добавляй неуказанные ограничения, требования или предположения. Если существенная неоднозначность мешает безопасно выполнить задачу, задай один конкретный уточняющий вопрос. Перед изменением назови проверяемый результат и критерии приёмки. Вноси минимальное изменение, подтверждённое данными. Не повторяй прежнее исправление без новых фактов. На одну проблему допускается не более трёх попыток всего: первоначальная и две корректировки; после этого остановись, сообщи точную причину и запроси решение владельца. Если критерии приёмки выполнены и подтверждены проверкой, закрой задачу и не меняй её повторно без новых данных или нового указания владельца. Всегда разделяй подтверждённое, выполненное, проверенное и ещё не проверенное.'};
function save(){localStorage.setItem(KEY,JSON.stringify(chat))}
function avatar(who,cls){let e=document.createElement('div');e.className=cls;let src=avatars[who];if(src){let im=document.createElement('img');im.src=src;im.onerror=()=>e.textContent=who==='sofia'?'🌷':'👤';e.append(im)}else e.textContent=who==='sofia'?'🌷':'👤';return e}
function paint(id,who){let e=$(id);e.replaceChildren();let src=avatars[who];if(src){let im=document.createElement('img');im.src=src;im.onerror=()=>e.textContent=who==='sofia'?'🌷':'👤';e.append(im)}else e.textContent=who==='sofia'?'🌷':'👤'}
function render(){let a=$('messages');a.replaceChildren();for(let m of chat){let r=document.createElement('div');r.className='row '+(m.who==='me'?'me':'');let b=document.createElement('div');b.className='bubble';let t=document.createElement('div');t.textContent=m.text;let s=document.createElement('div');s.className='stamp';s.textContent=new Date(m.date).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});b.append(t,s);if(m.who==='me')r.append(b,avatar('alexey','mini-avatar'));else r.append(avatar('sofia','mini-avatar'),b);a.append(r)}a.scrollTop=a.scrollHeight;save();paint('sofiaHead','sofia');paint('sofiaProfile','sofia');paint('alexeyProfile','alexey')}
if(!chat.length)chat=[{who:'sofia',text:'Привет, любимый! ❤️ Это наш личный чат.',date:new Date().toISOString()}];render();
let pendingMessages=null,isSending=false;
function setConnection(message, retryable=false){
  const status=$('connection');
  status.replaceChildren(document.createTextNode(message));
  if(retryable){
    const button=document.createElement('button');
    button.type='button';
    button.textContent='Повторить';
    button.onclick=retryPending;
    status.append(button);
  }
}
async function attemptPending(){
  if(isSending || !pendingMessages) return;
  isSending=true;
  const requestSnapshot=pendingMessages;
  $('sendBtn').disabled=true;
  $('input').disabled=true;
  $('voiceBtn').disabled=true;
  setConnection('София печатает…');
  let result;
  try {
    const res=await fetch(CHAT_API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:requestSnapshot})
    });
    let data;
    try { data=await res.json(); }
    catch { throw new Error('Сервер вернул некорректный ответ'); }
    if(!res.ok) throw new Error('Сервис временно недоступен (HTTP '+res.status+')');
    const answer=data.choices?.[0]?.message?.content;
    if(typeof answer!=='string' || !answer.trim()) throw new Error('Сервис не прислал текст ответа');
    result={ok:true,answer};
  } catch(error) {
    result={ok:false,message:'Не удалось получить ответ. Проверь соединение и попробуй ещё раз.'};
  }
  const applied=applyAssistantResult(chat,result);
  chat=applied.chat;
  if(result.ok && pendingMessages===requestSnapshot) pendingMessages=null;
  setConnection(applied.message,applied.status==='error' && pendingMessages===requestSnapshot);
  isSending=false;
  $('sendBtn').disabled=false;
  $('input').disabled=false;
  $('voiceBtn').disabled=false;
  render();
}
async function send(v){
  chat.push({who:'me',text:v,date:new Date().toISOString()});
  render();
  pendingMessages=buildChatRequestMessages(system,chat,30);
  await attemptPending();
}
function retryPending(){
  if(pendingMessages) attemptPending();
}
$('form').onsubmit=e=>{e.preventDefault();if(isSending)return;let v=$('input').value.trim();if(v){$('input').value='';send(v)}};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!isSending)$('form').requestSubmit()}};
$('menuBtn').onclick=()=>$('menu').classList.toggle('open');$('profileBtn').onclick=$('settingsBtn').onclick=()=>{$('menu').classList.remove('open');$('overlay').classList.add('open')};$('closeSheet').onclick=()=>$('overlay').classList.remove('open');
function pick(w){let f=$(w+'File').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),z=Math.min(1,500/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);avatars[w]=c.toDataURL('image/jpeg',.82);localStorage.setItem(AVS,JSON.stringify(avatars));render()};im.src=rd.result};rd.readAsDataURL(f)}
$('sofiaPick').onclick=()=>$('sofiaFile').click();$('alexeyPick').onclick=()=>$('alexeyFile').click();$('sofiaFile').onchange=()=>pick('sofia');$('alexeyFile').onchange=()=>pick('alexey');
$('exportBtn').onclick=()=>{let txt=chat.map(m=>new Date(m.date).toLocaleString('ru-RU')+' '+(m.who==='me'?'Ты':'София')+': '+m.text).join('\\n\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='Переписка.txt';a.click();$('menu').classList.remove('open')};$('clearBtn').onclick=()=>{if(confirm('Удалить всю переписку?')){chat=[];render()}$('menu').classList.remove('open')};
let rec=null;$('voiceBtn').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceStatus').textContent='Используй микрофон клавиатуры Samsung.';return}rec=new SR();rec.lang='ru-RU';rec.onresult=e=>$('input').value=e.results[0][0].transcript;rec.onend=()=>{$('voiceStatus').textContent='Голосовой ввод завершён';rec=null};$('voiceStatus').textContent='Слушаю…';rec.start()};
</script></body></html>
