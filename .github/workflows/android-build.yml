name: Sofia Android build

on:
  push:
    branches:
      - core/v0.1-storage-port
      - fix/cloudflare-preview-build-config-20261121
    paths:
      - "app/**"
      - "src/**"
      - "test/**"
      - "tests/worker/**"
      - "index.html"
      - "_worker.js"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - core/v0.1-storage-port

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run core and image intake tests
        run: node --test test/media-share-intake.test.mjs test/image-analysis-route.test.mjs test/session-auth.test.mjs tests/worker/chat-route.test.mjs tests/worker/worker-entry.test.mjs

  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sofia-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
