name: Storage Port Contract Tests

on:
  push:
    branches:
      - core/v0.1-storage-port
    paths:
      - "src/core/storage/**"
      - "tests/storage/**"
      - ".github/workflows/storage-port-tests.yml"
  pull_request:
    paths:
      - "src/core/storage/**"
      - "tests/storage/**"
      - ".github/workflows/storage-port-tests.yml"

permissions:
  contents: read

jobs:
  storage-port-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run storage contract tests
        run: node --test tests/storage/*.test.mjs
