name: Sofia pairing guard tests

on:
  push:
    branches:
      - security/durable-pairing-guard-20261121
      - security/no-global-owner-lockout-20261121
      - fix/cloudflare-preview-build-config-20261121
      - security/core-secret-boundary-20261122
      - security/single-use-pairing-challenge-20261122

jobs:
  pairing-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare Worker and Durable Object configuration
        run: npx --yes wrangler@4 deploy --dry-run --name sofia-preview --outdir .wrangler/deploy
      - name: Run Worker and pairing security tests
        run: node --test test/*.test.mjs tests/client/*.test.mjs tests/worker/*.test.mjs tests/providers/openrouter-provider.test.mjs tests/core/provider-credential-port.test.mjs tests/integration/worker-core-openrouter.integration.test.mjs
