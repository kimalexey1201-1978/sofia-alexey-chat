name: Sofia Core Skeleton Tests

on:
  push:
    branches:
      - "feat/sofia-core-skeleton-v1"
    paths:
      - "core-skeleton/**"
      - ".github/workflows/core-skeleton-tests.yml"
  pull_request:
    paths:
      - "core-skeleton/**"
      - ".github/workflows/core-skeleton-tests.yml"

permissions:
  contents: read

jobs:
  core-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Core Skeleton tests
        run: node --test core-skeleton/test/*.test.mjs
