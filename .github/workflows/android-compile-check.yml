name: Android compile check

on:
  push:
    branches:
      - "fix/android-owner-memory-voice-20261124"
    paths:
      - "android/**"
      - ".github/workflows/android-compile-check.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-compile-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android Kotlin sources
        run: gradle -p android :app:compileDebugKotlin
