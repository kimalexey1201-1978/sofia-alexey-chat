name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android sources (independent of signing)
        run: gradle -p android :app:compileDebugKotlin
      - name: Prepare permanent signing key
        env:
          SOFIA_KEYSTORE_BASE64: ${{ secrets.SOFIA_KEYSTORE_BASE64 }}
        run: |
          test -n "$SOFIA_KEYSTORE_BASE64" || (echo "Missing SOFIA_KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$SOFIA_KEYSTORE_BASE64" | base64 --decode > android/app/sofia-release.jks
          test -s android/app/sofia-release.jks || (echo "Decoded keystore file is empty" && exit 1)
          chmod 600 android/app/sofia-release.jks
          echo "Decoded keystore SHA-256 fingerprint:"
          sha256sum android/app/sofia-release.jks
      - name: Verify signing credentials
        env:
          SOFIA_STORE_PASSWORD: ${{ secrets.SOFIA_STORE_PASSWORD }}
          SOFIA_KEY_ALIAS: ${{ secrets.SOFIA_KEY_ALIAS }}
          SOFIA_KEY_PASSWORD: ${{ secrets.SOFIA_KEY_PASSWORD }}
        run: |
          test -n "$SOFIA_STORE_PASSWORD" || (echo "Missing SOFIA_STORE_PASSWORD secret" && exit 1)
          test -n "$SOFIA_KEY_ALIAS" || (echo "Missing SOFIA_KEY_ALIAS secret" && exit 1)
          test -n "$SOFIA_KEY_PASSWORD" || (echo "Missing SOFIA_KEY_PASSWORD secret" && exit 1)

          if ! keytool -list -keystore android/app/sofia-release.jks -storepass "$SOFIA_STORE_PASSWORD" >"$RUNNER_TEMP/keystore-open.log" 2>&1; then
            if grep -Eqi "password was incorrect|tampered with" "$RUNNER_TEMP/keystore-open.log"; then
              echo "Signing check failed: SOFIA_STORE_PASSWORD was rejected by the keystore."
            elif grep -Eqi "invalid keystore format|unrecognized keystore format|not a valid keystore" "$RUNNER_TEMP/keystore-open.log"; then
              echo "Signing check failed: decoded file is not a readable Java keystore."
            else
              echo "Signing check failed: keytool could not open the decoded keystore. Diagnostic:"
              sed -n '1,8p' "$RUNNER_TEMP/keystore-open.log"
            fi
            exit 1
          fi

          keytool -list -keystore android/app/sofia-release.jks -storepass "$SOFIA_STORE_PASSWORD" -alias "$SOFIA_KEY_ALIAS" >/dev/null || (echo "Signing check failed: SOFIA_KEY_ALIAS does not exist in this keystore" && exit 1)
          keytool -certreq -alias "$SOFIA_KEY_ALIAS" -keystore android/app/sofia-release.jks -storepass "$SOFIA_STORE_PASSWORD" -keypass "$SOFIA_KEY_PASSWORD" -file "$RUNNER_TEMP/sofia-signing-check.csr" >/dev/null || (echo "Signing check failed: SOFIA_KEY_PASSWORD was rejected for this alias" && exit 1)
          rm -f "$RUNNER_TEMP/sofia-signing-check.csr"
          echo "Signing credentials verified."
      - name: Build signed APK
        run: gradle -p android assembleDebug
      - name: Verify APK signature and package
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "^package: name='com.sofia.ai'"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sofia-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
